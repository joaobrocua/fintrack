name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma Client just needs these set; CI never connects to a DB.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/fintrack?schema=public"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/fintrack?schema=public"
      AUTH_SECRET: "ci-placeholder-secret-not-used-anywhere"
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
